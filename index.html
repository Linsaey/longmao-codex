<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1410">
<title>龙猫放置 · 图鉴</title>
<style>
  :root{
    --bg:#0b1310; --bg2:#111c16; --line:#25392b; --line2:#1b2b21;
    --txt:#d7e6d6; --dim:#8aa393; --pri:#7cc45a; --pri2:#3f6f34;
    --gold:#e3c069; --red:#e07a6a; --blue:#6aa5e0; --purple:#a98ad8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 10px}
  header{position:sticky;top:0;z-index:20;background:rgba(11,19,16,.96);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 0 6px}
  .hd{display:flex;align-items:center;gap:8px}
  .logo{font-weight:700;font-size:16px;color:#eaf6e4;white-space:nowrap}
  .logo b{color:var(--pri)}
  .meta{margin-left:auto;font-size:11px;color:var(--dim);text-align:right;line-height:1.3}
  .search{margin-top:7px;position:relative}
  .search input{width:100%;padding:9px 32px 9px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0e1812;color:var(--txt);font-size:15px;outline:none}
  .search input::placeholder{color:#5f7566}
  .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
    color:var(--dim);font-size:16px;padding:4px 6px;display:none}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:#0f1a14;color:#a9bfac;font-size:13px;white-space:nowrap}
  .tab.on{background:var(--pri2);border-color:var(--pri);color:#eaf7e2;font-weight:600}
  .filters{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:4px 10px;border-radius:8px;border:1px solid var(--line2);
    background:#0c1611;color:#8fa694;font-size:12px}
  .chip.on{background:#1d3324;border-color:#3d6b3a;color:#cfe8c4}
  .count{font-size:11px;color:var(--dim);padding:0 2px 6px}
  grid,.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));padding-bottom:20px}
  .card{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line2);
    border-radius:10px;background:linear-gradient(180deg,#101c15,#0c1511);text-align:left;color:inherit;
    cursor:pointer;min-height:56px}
  .card:active{transform:scale(.985)}
  .ico{width:44px;height:44px;flex:0 0 44px;border-radius:8px;background:#0a110d;
    object-fit:contain;display:block}
  .ico.ph{display:flex;align-items:center;justify-content:center;color:#3d5443;font-size:11px}
  .c1{min-width:0;flex:1}
  .c1 .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c1 .sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c1 .tag{display:inline-block;font-size:10px;padding:0 4px;border-radius:4px;margin-right:4px;
    border:1px solid var(--line);color:#9fb8a3}
  .tag.rare{border-color:#8a6a2a;color:var(--gold)}
  .tag.boss{border-color:#7a3b3b;color:var(--red)}
  .tag.set{border-color:#3f5f7a;color:var(--blue)}
  .empty{padding:40px 10px;text-align:center;color:var(--dim)}
  /* 详情 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
    transition:opacity .18s;z-index:40}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:#0f1a14;
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:50;
    transform:translateY(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column}
  .sheet.on{transform:translateY(0)}
  .sh-hd{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .sh-hd .big{width:56px;height:56px;flex:0 0 56px;border-radius:10px;background:#0a110d;object-fit:contain}
  .sh-hd .tt{min-width:0}
  .sh-hd .tt h2{margin:0;font-size:16px;line-height:1.3}
  .sh-hd .tt .s{font-size:11px;color:var(--dim);margin-top:2px}
  .sh-x{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:#132019;color:#b9cdb9;font-size:16px}
  .sh-bd{overflow-y:auto;padding:12px 14px 26px;-webkit-overflow-scrolling:touch}
  .sec{margin:0 0 14px}
  .sec h3{margin:0 0 6px;font-size:12px;color:var(--pri);font-weight:600;letter-spacing:.04em}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:2px 10px;
    font-size:12.5px;color:#c4d7c5}
  .kv span{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed #1c2b21}
  .kv i{color:var(--dim);font-style:normal}
  .kv b{font-weight:600;color:#e6f3e4}
  .desc{font-size:12.5px;color:#aec4b1;white-space:pre-wrap;line-height:1.5}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:4px 6px;border-bottom:1px solid #1a2820;text-align:left;white-space:nowrap}
  th{color:var(--dim);font-weight:500}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .rowlink{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #17231b;
    cursor:pointer;font-size:12.5px}
  .rowlink img{width:26px;height:26px;border-radius:5px;background:#0a110d;object-fit:contain}
  .rowlink .g{margin-left:auto;color:var(--dim);font-size:11.5px;padding-left:8px}
  .pool{font-size:11px;color:#7d9a83;padding:2px 0 4px}
  .pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;
    border:1px solid var(--line);color:#9fb8a3;margin:0 4px 4px 0}
  footer{padding:18px 4px 26px;font-size:11px;color:#5f7566;text-align:center;line-height:1.6}
  .src-prob{color:var(--gold)}
  @media (min-width:640px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
    .sheet{left:50%;right:auto;transform:translate(-50%,102%);width:640px;border-radius:16px 16px 0 0}
    .sheet.on{transform:translate(-50%,0)}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">龙猫放置 · <b>图鉴</b></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索名称 / ID（怪物、装备、道具、技能…）" autocomplete="off">
      <button class="clr" id="clrq">✕</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
  </div>
</header>
<div class="wrap">
  <div class="grid" id="grid"></div>
</div>
<footer>
  数据取自游戏本体静态表（<span class="mono">/data/*.json</span>），图标来自游戏资源。<br>
  掉落概率按客户端逻辑计算：独立掉落按原值；池掉落按「整池概率 / 池内件数」。
</footer>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sh-hd">
    <img class="big" id="shIco" alt="">
    <div class="tt"><h2 id="shName"></h2><div class="s" id="shSub"></div></div>
    <button class="sh-x" id="shX">✕</button>
  </div>
  <div class="sh-bd" id="shBody"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
